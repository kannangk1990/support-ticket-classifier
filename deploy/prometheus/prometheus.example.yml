# Minimal Prometheus config that scrapes a locally running classifier
# (`uv run ticket-classifier serve`) and loads the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ticket-classifier
    static_configs:
      - targets: ["127.0.0.1:8000"]
