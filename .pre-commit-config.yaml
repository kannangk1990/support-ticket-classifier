# `pre-commit install` sets up both hooks: fast checks on commit, the full CI gate on push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Same checks as CI, so a push is refused unless everything passes.
      - id: ci-gate
        name: ruff, mypy and the full test suite
        entry: bash -c 'uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
